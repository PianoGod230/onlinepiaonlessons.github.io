    <style>
      html, body {
            margin: 0;

            width: 100%;

        .video-container {
            position: relative;
            width: 100vw; 
            height: 100vh;
            display: flex;

        }
        .video-container iframe {

            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
            border: 0;
        }
    </style>
    <div class="video-container">
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/v=Lu77_loWHSw"
        title="Youtube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </head>
